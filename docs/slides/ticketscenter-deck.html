<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TicketsCenter — Final Project</title>
<style>
:root{--bg:#fbfbff;--card:#ffffff;--line:#e3e6f5;--tx:#171c3a;--mut:#565f8a;--fc:#6d4aff;--fc2:#ec4899}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;padding:4vh 5vw 7vh;display:flex;flex-direction:column;opacity:0;pointer-events:none;overflow:hidden;
  transform:translateX(40px) scale(.99);transition:opacity .35s,transform .35s;background:var(--bg)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.past{transform:translateX(-40px) scale(.99)}
.slide>*{position:relative;z-index:2}
.slide>.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38}
.dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--fc) 28%,transparent) 1.2px,transparent 1.3px);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(120deg,#000 0%,transparent 38%,transparent 62%,#000 100%);mask-image:linear-gradient(120deg,#000 0%,transparent 38%,transparent 62%,#000 100%);opacity:.7}
.strip{position:absolute;left:0;top:0;bottom:0;width:.6vw;background:linear-gradient(180deg,var(--fc),var(--fc2))}
.tag{display:inline-flex;align-items:center;gap:.6vw;font-size:1.35vh;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:#fff;
  background:linear-gradient(90deg,var(--fc),var(--fc2));padding:.6vh 1vw;border-radius:99px;align-self:flex-start;box-shadow:0 6px 18px color-mix(in srgb,var(--fc) 35%,transparent)}
h1{font-size:7.4vh;line-height:1.02;font-weight:900;letter-spacing:-.025em}
h2{font-size:4.3vh;font-weight:900;letter-spacing:-.015em;margin:1.2vh 0 1.4vh}
.grad{background:linear-gradient(90deg,var(--fc),var(--fc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rain{background:linear-gradient(90deg,#6d4aff,#ec4899,#f97316,#eab308,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);font-size:2.2vh;margin-top:1.2vh}
.body{flex:1;min-height:0;display:flex;gap:1.6vw}
.grid{display:grid;gap:1.6vh 1.2vw;width:100%;align-content:start}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.6vh 1.1vw;box-shadow:0 6px 22px rgba(60,70,150,.10);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--k,var(--fc)),var(--k2,var(--fc2)))}
.card h3{font-size:2.1vh;margin-bottom:.7vh;font-weight:800}
.card p,.card li{color:var(--mut);font-size:1.65vh;line-height:1.45}
.card ul{list-style:none;padding:0}.card li{padding-left:1.2em;position:relative}
.card li:before{content:"";position:absolute;left:.1em;top:.55em;width:.5em;height:.5em;border-radius:50%;background:linear-gradient(135deg,var(--k,var(--fc)),var(--k2,var(--fc2)))}
.big{font-size:5.6vh;font-weight:900;line-height:1}
.ico{width:5.4vh;height:5.4vh;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.9vh;margin-bottom:.9vh;
  background:linear-gradient(135deg,var(--k,var(--fc)),var(--k2,var(--fc2)));box-shadow:0 8px 18px color-mix(in srgb,var(--k,var(--fc)) 35%,transparent)}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
code{background:color-mix(in srgb,var(--k,var(--fc)) 10%,#fff);border:1px solid color-mix(in srgb,var(--k,var(--fc)) 25%,#fff);padding:.08em .38em;border-radius:6px;font-size:.9em;color:color-mix(in srgb,var(--k,var(--fc)) 70%,#111);white-space:nowrap}
.pill{display:inline-block;padding:.5vh .9vw;border-radius:99px;font-size:1.5vh;font-weight:800;color:#fff;margin:.3vh .25vw .3vh 0}
.svgbox{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.svgbox svg{width:100%;height:100%}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(60,70,150,.10);padding:1vh .6vw}
.side{width:22vw;flex:none;display:flex;flex-direction:column;gap:1.2vh;justify-content:center}
.side .card{padding:1.4vh .9vw}
.note{font-size:1.55vh;color:var(--mut);line-height:1.4;margin-top:1vh}
/* cover */
.cover{flex:1;display:flex;gap:3vw;align-items:center;min-height:0}
.cover .l{flex:1.1}.cover .r{flex:.9;height:100%;display:flex;align-items:center;justify-content:center}
.no{font-size:15vh;font-weight:900;line-height:.85;letter-spacing:-.05em;opacity:.16}
.art{width:min(38vw,62vh);aspect-ratio:1;border-radius:36% 64% 58% 42%/45% 40% 60% 55%;background:linear-gradient(135deg,var(--fc),var(--fc2));display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 30px 70px color-mix(in srgb,var(--fc) 40%,transparent);animation:morph 9s ease-in-out infinite}
.art span{font-size:20vh;filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
.art i{position:absolute;border:3px solid rgba(255,255,255,.55);border-radius:50%;inset:9%}.art i+i{inset:20%;border-style:dashed;animation:spin 30s linear infinite}
.chipf{position:absolute;background:#fff;border-radius:14px;padding:1vh 1vw;font-weight:800;font-size:1.7vh;box-shadow:0 10px 26px rgba(40,50,120,.2);animation:float 5s ease-in-out infinite;white-space:nowrap}
@keyframes morph{50%{border-radius:58% 42% 40% 60%/55% 60% 40% 45%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
/* tiles */
.tile{border-radius:18px;padding:1.6vh 1vw;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(40,50,120,.18);transition:transform .2s}
.tile:hover{transform:translateY(-4px) scale(1.02)}
.tile b{font-size:2vh;display:block}.tile small{opacity:.9;font-size:1.4vh}.tile .e{font-size:3.4vh}
.tile:after{content:"";position:absolute;right:-18%;bottom:-40%;width:60%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18)}
/* sequence svg */
.lane{stroke:#cfd5ee;stroke-dasharray:4 5}
.msg{opacity:1}.msg.show{opacity:1}.msg.cur .ln{stroke-width:3.2}.msg.cur .bd{r:11}
.ln{stroke-width:2;fill:none}
.lbl{font-size:12.5px;font-weight:600;fill:#171c3a;font-family:Inter,system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.nt{font-size:11.5px;font-weight:600;font-family:Inter,system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.bn{font-size:10px;font-weight:800;fill:#fff;font-family:Inter,system-ui,sans-serif}
.pl{font-size:13px;font-weight:800;fill:#fff;font-family:Inter,system-ui,sans-serif}
.ps{font-size:10.5px;fill:#ffffffdd;font-family:Inter,system-ui,sans-serif}
.st{font-size:13px;font-weight:800;fill:#fff;font-family:"JetBrains Mono",ui-monospace,monospace}
.el{font-size:11.5px;font-weight:600;fill:#3a4270;font-family:Inter,system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
/* chrome */
#bar{position:fixed;left:0;top:0;height:5px;background:linear-gradient(90deg,#6d4aff,#ec4899,#f97316,#eab308,#10b981,#06b6d4);width:0;transition:width .3s;z-index:9}
#hud{position:fixed;right:2vw;bottom:1.8vh;color:var(--mut);font-size:1.5vh;z-index:9;display:flex;gap:.8vw;align-items:center}
#hud b{color:var(--tx)}
.nav{background:#fff;border:1px solid var(--line);color:var(--tx);border-radius:10px;width:3.8vh;height:3.8vh;cursor:pointer;font-size:1.9vh;box-shadow:0 3px 10px rgba(60,70,150,.12)}
.nav:hover{background:linear-gradient(135deg,#6d4aff,#ec4899);color:#fff}
#brand{position:fixed;left:5vw;bottom:2.1vh;color:var(--mut);font-size:1.35vh;z-index:9;letter-spacing:.12em;font-weight:700}
.flow{display:flex;align-items:center;gap:.5vw;flex-wrap:wrap}
.node{background:#fff;border-radius:14px;padding:1.2vh .9vw;font-size:1.75vh;font-weight:800;text-align:center;border:2px solid var(--k,var(--fc));box-shadow:0 6px 16px color-mix(in srgb,var(--k,var(--fc)) 22%,transparent)}
.node small{display:block;font-weight:500;color:var(--mut);font-size:1.3vh;margin-top:.3vh}
.arr{font-size:2.4vh;font-weight:900;color:var(--fc)}
@media (max-width:900px){.side{display:none}.g3,.g4{grid-template-columns:repeat(2,1fr)}.cover .r{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="deck"></div>
<div id="brand">TICKETSCENTER <span id="feat"></span></div>
<div id="hud"><button class="nav" id="prev">‹</button><span><b id="cur">1</b> / <span id="tot">1</span></span><button class="nav" id="next">›</button></div>

<script>
/* ================= palette ================= */
const C={violet:'#6d4aff',pink:'#ec4899',rose:'#f43f5e',orange:'#f97316',amber:'#f59e0b',yellow:'#eab308',lime:'#84cc16',green:'#10b981',teal:'#14b8a6',cyan:'#06b6d4',blue:'#3b82f6',indigo:'#4f46e5',purple:'#a855f7',slate:'#64748b',red:'#ef4444'};
const KIND={user:C.orange,app:C.violet,cache:C.rose,db:C.green,ext:C.cyan,job:C.blue};
const ALL=Object.values(C);

/* ================= decorations ================= */
function deco(seed,c1,c2){
  let r=seed*9301+49297;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const cols=[c1,c2,...ALL];let s='';
  for(let i=0;i<16;i++){
    const edge=rnd()<.5, x=edge?(rnd()<.5?rnd()*14:86+rnd()*14):rnd()*100, y=edge?rnd()*100:(rnd()<.5?rnd()*10:90+rnd()*10);
    const c=cols[Math.floor(rnd()*cols.length)],z=10+rnd()*22,t=Math.floor(rnd()*5),o=(.35+rnd()*.4).toFixed(2),rot=Math.floor(rnd()*360);
    const g=`transform="translate(${x*16} ${y*9}) rotate(${rot})" opacity="${o}"`;
    s+= t===0?`<circle ${g} r="${z/2}" fill="${c}"/>`
      : t===1?`<circle ${g} r="${z/2}" fill="none" stroke="${c}" stroke-width="3"/>`
      : t===2?`<path ${g} d="M0 ${-z/2}L${z/2} ${z/2}L${-z/2} ${z/2}Z" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`
      : t===3?`<path ${g} d="M${-z/2} 0H${z/2}M0 ${-z/2}V${z/2}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`
      :       `<path ${g} d="M${-z} 0q${z/4} ${-z/2} ${z/2} 0t${z/2} 0t${z/2} 0" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  return `<div class="deco"><div class="blob" style="width:42vw;height:42vw;right:-12vw;top:-16vw;background:${c1}"></div>
   <div class="blob" style="width:36vw;height:36vw;left:-12vw;bottom:-16vw;background:${c2}"></div>
   <div class="blob" style="width:20vw;height:20vw;left:38vw;top:-12vw;background:${ALL[(seed*3)%ALL.length]};opacity:.22"></div>
   <div class="dots"></div><svg viewBox="0 0 1600 900" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${s}</svg><div class="strip"></div></div>`;
}

/* ================= sequence renderer ================= */
let gid=0;
function seq(def){
  const P=def.p,n=P.length,W=1200,left=78,right=78,gap=(W-left-right)/(n-1),id=++gid;
  const x=i=>left+i*gap, top=98, step=def.step||46, H=top+def.m.length*step+24;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs>
   ${Object.entries(KIND).map(([k,c])=>`<marker id="a${id}${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>
   <linearGradient id="g${id}${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".72"/></linearGradient>`).join('')}</defs>`;
  def.m.forEach((m,j)=>{ if(j%2===0) s+=`<rect x="10" y="${top+j*step-10}" width="${W-20}" height="${step}" rx="8" fill="#f4f5fd"/>`; });
  P.forEach((p,i)=>{
    s+=`<line class="lane" x1="${x(i)}" y1="64" x2="${x(i)}" y2="${H-8}"/>
    <rect x="${x(i)-68}" y="8" width="136" height="56" rx="14" fill="url(#g${id}${p.k})"/>
    <text class="pl" x="${x(i)}" y="32" text-anchor="middle">${p.n}</text><text class="ps" x="${x(i)}" y="50" text-anchor="middle">${p.s||''}</text>`;
  });
  const clamp=(cx,t)=>{const w=t.replace(/&[a-z]+;/g,'x').length*3.25;return Math.max(w+8,Math.min(W-w-8,cx));};
  def.m.forEach((m,j)=>{
    const y=top+j*step+16,a=P.findIndex(q=>q.id===m.f),b=P.findIndex(q=>q.id===m.t),c=KIND[P[a].k];
    let g=`<g class="msg">`;
    if(a===b){
      const xa=x(a),L=a>n/2;
      g+=`<path class="ln" d="M${xa} ${y-9} h${L?-36:36} v18 h${L?36:-36}" stroke="${c}" marker-end="url(#a${id}${P[a].k})"/>
      <text class="lbl" x="${xa+(L?-46:46)}" y="${y-1}" ${L?'text-anchor="end"':''}>${m.x}</text>`;
      if(m.n)g+=`<text class="nt" fill="${c}" x="${xa+(L?-46:46)}" y="${y+14}" ${L?'text-anchor="end"':''}>${m.n}</text>`;
      g+=`<circle class="bd" cx="${xa}" cy="${y-9}" r="9.5" fill="${c}"/><text class="bn" x="${xa}" y="${y-5.5}" text-anchor="middle">${j+1}</text>`;
    }else{
      const x1=x(a),x2=x(b),dir=x2>x1?1:-1,mid=(x1+x2)/2;
      g+=`<line class="ln" x1="${x1+dir*10}" y1="${y}" x2="${x2-dir*3}" y2="${y}" stroke="${c}" marker-end="url(#a${id}${P[a].k})" ${m.d?'stroke-dasharray="6 4"':''}/>
      <text class="lbl" x="${clamp(mid,m.x)}" y="${y-7}" text-anchor="middle">${m.x}</text>`;
      if(m.n)g+=`<text class="nt" fill="${c}" x="${clamp(mid,m.n)}" y="${y+15}" text-anchor="middle">${m.n}</text>`;
      g+=`<circle class="bd" cx="${x1}" cy="${y}" r="9.5" fill="${c}"/><text class="bn" x="${x1}" y="${y+3.5}" text-anchor="middle">${j+1}</text>`;
    }
    s+=g+'</g>';
  });
  return s+'</svg>';
}

/* ================= state-machine renderer ================= */
function stm(nodes,edges,o={}){
  const cw=o.cw||220,rh=o.rh||120,bw=o.bw||166,bh=50,id=++gid;
  const cols=Math.max(...nodes.map(n=>n.c))+1,rows=Math.max(...nodes.map(n=>n.r))+1,W=cols*cw,H=rows*rh;
  const pos=n=>({x:n.c*cw+cw/2,y:n.r*rh+rh/2}),by=Object.fromEntries(nodes.map(n=>[n.id,n]));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs>
   <marker id="m${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4270"/></marker>
   <filter id="f${id}" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#28327a" flood-opacity=".22"/></filter></defs>`;
  edges.forEach(([a,b,l,off])=>{
    const A=pos(by[a]),B=pos(by[b]);let dx=B.x-A.x,dy=B.y-A.y;const len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    const t=Math.min(Math.abs(ux)<1e-6?1e9:(bw/2+4)/Math.abs(ux),Math.abs(uy)<1e-6?1e9:(bh/2+4)/Math.abs(uy));
    const ox=-uy*(off||0),oy=ux*(off||0);
    const x1=A.x+ux*t+ox,y1=A.y+uy*t+oy,x2=B.x-ux*(t+3)+ox,y2=B.y-uy*(t+3)+oy;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3a4270" stroke-width="2" marker-end="url(#m${id})"/>`;
    if(l)s+=`<text class="el" x="${(x1+x2)/2}" y="${(y1+y2)/2-7}" text-anchor="middle">${l}</text>`;
  });
  nodes.forEach(n=>{const p=pos(n),c=C[n.k]||n.k;
    s+=`<rect x="${p.x-bw/2}" y="${p.y-bh/2}" width="${bw}" height="${bh}" rx="25" fill="${c}" filter="url(#f${id})"/>
    <text class="st" x="${p.x}" y="${p.y+4.5}" text-anchor="middle">${n.l||n.id}</text>`;});
  return s+'</svg>';
}

/* ================= slide builders ================= */
const S=[];let cur={n:'',c:[C.violet,C.pink],no:0};
const push=(html,o={})=>S.push({html,c:cur.c,feat:cur.n,...o});
const slide=(tag,title,body)=>push(`<div class="tag">${tag}</div><h2>${title}</h2>${body}`);
const card=(t,items,k,k2)=>`<div class="card" style="--k:${k||'var(--fc)'};--k2:${k2||k||'var(--fc2)'}"><h3>${t}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
const cd=a=>a.map(x=>`<code>${x}</code>`).join(' ');
function feature(name,emoji,c1,c2,tagline,chips,stats){
  cur={n:name,c:[c1,c2],no:cur.no+1};const no=String(cur.no).padStart(2,'0');
  push(`<div class="cover"><div class="l">
    <div class="no grad">${no}</div><div class="tag" style="margin-top:-2vh">Feature ${no}</div>
    <h1 style="margin-top:1.6vh"><span class="grad">${name}</span></h1>
    <p class="sub" style="font-size:2.9vh;color:var(--tx)">${tagline}</p>
    <div class="grid g3" style="margin-top:3vh">${stats.map(([b,t],i)=>`<div class="card" style="--k:${[c1,c2,ALL[(cur.no*2+3)%ALL.length]][i]};--k2:${[c2,c1,c1][i]}"><div class="big" style="color:${[c1,c2,c1][i]};font-size:4.4vh">${b}</div><p>${t}</p></div>`).join('')}</div>
   </div><div class="r"><div class="art"><i></i><i></i><span>${emoji}</span>
    ${chips.map((c,i)=>`<div class="chipf mono" style="${['left:-8%;top:10%','right:-10%;top:36%','left:2%;bottom:6%'][i]};color:${[c1,c2,c1][i]};animation-delay:${i*.9}s">${c}</div>`).join('')}</div></div></div>`,{cover:1,emoji});
}
const seqS=(title,def,side)=>push(`<div class="tag">${cur.n} · sequence</div><h2>${title}</h2>
  <div class="body"><div class="svgbox panel">${seq(def)}</div>${side?`<div class="side">${side}</div>`:''}</div>`,{seq:true});
const deep=(title,diagram,cards,note)=>push(`<div class="tag">${cur.n} · inside</div><h2>${title}</h2>
  <div class="body"><div class="svgbox panel" style="flex:1.15">${diagram}</div><div class="side" style="width:34vw">${cards.join('')}</div></div>${note?`<p class="note">${note}</p>`:''}`);

/* =====================================================================
   INTRO
   ===================================================================== */
cur={n:'',c:[C.violet,C.pink],no:0};
push(`<div style="display:flex;flex-direction:column;height:100%;justify-content:center;gap:2.4vh">
  <div class="tag">Final project · Database Management Systems</div>
  <h1 style="font-size:11vh">Tickets<span class="rain">Center</span></h1>
  <p class="sub" style="font-size:3vh;max-width:62vw;color:var(--tx)">A third-party ticketing platform — organizers sell, buyers pay, venues scan.<br>Every business rule lives in <b style="color:${C.green}">SQL Server</b>.</p>
  <div>${[['Java 25',C.violet],['Servlet 6.1 · JSP',C.pink],['Hibernate · HikariCP',C.orange],['Azure SQL',C.green],['Redis',C.rose],['VNPAY Sandbox',C.cyan],['Cloudinary',C.blue]].map(([t,c])=>`<span class="pill" style="background:${c}">${t}</span>`).join('')}</div>
  <p class="sub" style="font-size:1.8vh">← → or Space to navigate · F fullscreen</p></div>`);

cur.c=[C.orange,C.pink];
slide('The platform','One marketplace, <span class="grad">three sides</span>',`
<div class="body" style="flex-direction:column;justify-content:center;gap:2vh">

    ['📮','Transactional outbox','Intent commits with the data. External calls never sit inside a transaction.',C.purple,C.blue],
    ['🧾','Immutable money','Triggers freeze payments, refunds, snapshots. Ledgers are append-only.',C.amber,C.orange],
    ['🧩','Cache ≠ truth','Redis accelerates; SQL decides. Redis down means slower, not wrong.',C.cyan,C.blue],
    ['🛰️','Reconcile unknowns','UNKNOWN is a state. A worker asks the provider instead of guessing.',C.indigo,C.violet]]
  .map(([e,t,d,a,b])=>`<div class="card" style="--k:${a};--k2:${b}"><div class="ico">${e}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}
</div></div>`);

cur.c=[C.green,C.blue];
slide('Quality &amp; delivery','Proof, <span class="grad">not promises</span>',`
<div class="body" style="align-items:center"><div class="grid g3">
 ${[['335','tests executed · 60 external opt-in skips · 0 failures (baseline run)',C.green],['T-SQL','scenario tests that THROW: concurrency, permissions, temporal, guardrails',C.violet],['13','GitHub workflows: quality, CVE scan, build, staging smoke, deploy',C.orange]]
   .map(([b,t,c])=>`<div class="card" style="--k:${c};--k2:${c}"><div class="big" style="color:${c}">${b}</div><p>${t}</p></div>`).join('')}
 ${card('Local fixture',['<code>setup.ps1</code> builds a fresh database','<code>run.ps1 -Smoke</code>: real login, CSRF, finance, JSP'],C.cyan,C.blue)}
 ${card('Migrations',['Ledger <code>tc_schema_migrations</code> by file name + SHA-256','Applied files are never edited'],C.pink,C.rose)}
 ${card('Backup &amp; recovery',['Full · differential · log','Point-in-time restore · BACPAC export'],C.amber,C.orange)}
</div></div>`);

cur.c=[C.violet,C.cyan];
push(`<div style="display:flex;flex-direction:column;height:100%;justify-content:center;align-items:center;gap:2.6vh;text-align:center">
 <div class="tag" style="align-self:center">Summary</div>
 <h1 style="font-size:6.6vh"><span class="rain">Hold · Pay · Scan · Refund · Settle</span></h1>
 <p class="sub" style="font-size:2.6vh;max-width:58vw;color:var(--tx)">Eleven features, one source of truth: <b style="color:${C.green}">the database</b>.</p>
 <div class="flow" style="justify-content:center"><div class="node" style="--k:${C.orange}">Thin Java edge</div><span class="arr">+</span><div class="node" style="--k:${C.green}">SQL authority</div><span class="arr">+</span><div class="node" style="--k:${C.rose}">Redis speed</div><span class="arr">+</span><div class="node" style="--k:${C.blue}">Idempotent workers</div></div>
 <h2 class="grad" style="margin-top:2vh;font-size:5vh">Thank you — questions?</h2></div>`);

/* ================= engine ================= */
const deck=document.getElementById('deck');
S.forEach((s,k)=>{const d=document.createElement('section');d.className='slide';
  d.style.setProperty('--fc',s.c[0]);d.style.setProperty('--fc2',s.c[1]);
  d.innerHTML=deco(k+3,s.c[0],s.c[1])+s.html;deck.appendChild(d);s.el=d;
  s.steps=0;s.step=0;});
document.getElementById('tot').textContent=S.length;
let i=0;
function render(){
  S.forEach((s,k)=>{s.el.classList.toggle('on',k===i);s.el.classList.toggle('past',k<i);
    if(s.seq)s.el.querySelectorAll('.msg').forEach((m,j)=>{m.classList.toggle('show',j<s.step);m.classList.toggle('cur',j===s.step-1);});});
  document.getElementById('cur').textContent=i+1;
  document.getElementById('feat').innerHTML=S[i].feat?'· '+S[i].feat.toUpperCase():'· FINAL PROJECT';
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
function next(){const s=S[i];if(s.seq&&s.step<s.steps){s.step++;render();return;}if(i<S.length-1){i++;render();}}
function prev(){const s=S[i];if(s.seq&&s.step>0){s.step--;render();return;}if(i>0){i--;const t=S[i];if(t.seq)t.step=t.steps;render();}}
function jump(n){i=Math.max(0,Math.min(S.length-1,n));const s=S[i];if(s.seq&&s.step===0)s.step=s.steps;render();}
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')jump(0);else if(e.key==='End')jump(S.length-1);
  else if(e.key==='ArrowDown'){e.preventDefault();jump(i+1);}else if(e.key==='ArrowUp'){e.preventDefault();jump(i-1);}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.querySelectorAll('.tile[data-f]').forEach(t=>t.onclick=()=>{let n=+t.dataset.f,c=0;const k=S.findIndex(s=>s.cover&&++c===n);if(k>=0)jump(k);});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX);
addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)(d<0?next:prev)();tx=null;});
const h=parseInt(location.hash.slice(1));if(h>1)jump(h-1);else render();
</script>
</body>
