name: KHANH-06 event cancellation acceptance
on:
  push:
    branches: [dev, feat/khanh/khanh-06-event-cancellation]
  pull_request:
    branches: [dev]
    paths: ['src/main/java/vn/ticketscenter/event/cancellation/**', 'src/main/java/vn/ticketscenter/event/repository/EventCancellationRepository.java', 'src/main/java/vn/ticketscenter/config/worker/EventCancellationJob.java', 'src/main/java/vn/ticketscenter/config/persistence/PersistenceListener.java', 'src/main/webapp/assets/js/*events*.js', 'src/main/webapp/assets/js/event-cancellation.js', 'src/main/webapp/WEB-INF/views/admin/event-approval.jsp', 'src/main/resources/openapi.json', 'src/test/java/vn/ticketscenter/database/**', 'src/test/java/vn/ticketscenter/event/cancellation/**', 'src/test/resources/cancellation/**', 'database/migrations/**', '.github/workflows/khanh06-event-cancellation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        schema: [legacy-adapter, canonical-050]
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ format('Khanh06_{0}_Aa!', github.run_id) }}
        ports: ['1433:1433']
      redis:
        image: redis:7.4
        ports: ['6379:6379']
    env:
      TC_CANCELLATION_SQL_TEST: 'true'
      TC_CANCELLATION_REDIS_TEST: 'true'
      TC_SCAN_TEST_URL: 'jdbc:sqlserver://127.0.0.1:1433;databaseName=TicketCenter_Khanh02_Test;encrypt=true;trustServerCertificate=true;loginTimeout=5'
      TC_SCAN_SA_PASSWORD: ${{ format('Khanh06_{0}_Aa!', github.run_id) }}
      TC_SCAN_OWNER_USER: khanh02_owner
      TC_SCAN_CHECKIN_USER: khanh02_checkin
      REDIS_HOST: '127.0.0.1'
      REDIS_PORT: '6379'
      TC_KHANH06_BROWSER_SCRIPT: src/test/resources/cancellation/browser-acceptance.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate masked disposable fixture credentials
        shell: python
        run: |
          import os,secrets
          values={key:'K02!'+secrets.token_hex(24) for key in ('TC_SCAN_OWNER_PASSWORD','TC_SCAN_CHECKIN_PASSWORD','TC_SCAN_FIXTURE_PASSWORD','TC_TICKET_SIGNING_SECRET')}
          for value in [os.environ['TC_SCAN_SA_PASSWORD'],*values.values()]: print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key,value in values.items(): out.write(key+'='+value+'\n')
      - name: Compile acceptance harness
        run: mvn -B -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/khanh06-classpath.txt -Dmdep.includeScope=test
      - name: Wait for isolated SQL Server
        run: |
          set -euo pipefail
          container=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_SCAN_SA_PASSWORD" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
      - name: Install complete schema and additive cancellation runtime
        env:
          SCHEMA_VARIANT: ${{ matrix.schema }}
        run: |
          mode=()
          if [ "$SCHEMA_VARIANT" = 'canonical-050' ]; then mode=(--canonical); fi
          java -cp "target/test-classes:target/classes:$(cat target/khanh06-classpath.txt)" vn.ticketscenter.database.EventCancellationCiSetup "${mode[@]}"
      - name: Require real SQL, Redis, authorization, concurrency, rollback and recovery
        run: mvn -B test -Djunit.jupiter.extensions.autodetection.enabled=false -Dtest=EventCancellationSqlServerTest,EventCancellationServiceTest,EventCancellationRequestTest,CancellationProgressRedisTest,FinanceOpenApiContractTest
      - name: Require all suites without skips
        if: always()
        run: node src/test/scripts/test-report-summary.cjs target/surefire-reports --require-no-skips --require-suite=vn.ticketscenter.database.EventCancellationSqlServerTest --require-suite=vn.ticketscenter.event.cancellation.service.EventCancellationServiceTest --require-suite=vn.ticketscenter.event.cancellation.controller.EventCancellationRequestTest --require-suite=vn.ticketscenter.event.cancellation.service.CancellationProgressRedisTest --require-suite=vn.ticketscenter.swagger.FinanceOpenApiContractTest --summary="$GITHUB_STEP_SUMMARY"
      - name: Package complete production WAR
        run: mvn -B -DskipTests package
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix target/khanh06-browser --no-audit --no-fund playwright@1.58.2
          target/khanh06-browser/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/target/khanh06-browser/node_modules" >> "$GITHUB_ENV"
      - name: Accept real login, UI20, lost response and Tomcat restart with restricted ADMIN and WORKER
        run: python3 src/test/resources/cancellation/web-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khanh06-cancellation-${{ matrix.schema }}
          path: |
            target/surefire-reports/
            target/khanh06-web-acceptance.json
            target/khanh06-browser-acceptance.json
            target/khanh06-review-*.png
            target/khanh06-tomcat-*.log
