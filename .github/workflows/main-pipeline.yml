name: "CI with Explicit External Actions"
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_database_tests:
        description: "Run disposable SQL fixture tests"
        type: boolean
        default: false
      run_http_smoke:
        description: "Run isolated Swagger HTTP boundary tests"
        type: boolean
        default: false
      publish_images:
        description: "Publish container image (main/dev only)"
        type: boolean
        default: false
      deploy_to_production:
        description: "Run protected production rollout simulation"
        type: boolean
        default: false
      deployment_strategy:
        type: choice
        options: [blue-green, canary]
        default: blue-green
permissions:
  contents: read
  checks: write
  security-events: write
jobs:
  stage-1-quality-and-security:
    uses: ./.github/workflows/01-code-quality-security.yml
  stage-2-tests-and-coverage:
    needs: stage-1-quality-and-security
    uses: ./.github/workflows/02-unit-integration-tests.yml
    with:
      run_db_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_database_tests == true }}
  stage-3-dependency-and-cve:
    needs: stage-2-tests-and-coverage
    uses: ./.github/workflows/03-dependency-cve-scan.yml
  stage-4-build-and-packaging:
    needs: stage-3-dependency-and-cve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/04-build-docker-packaging.yml
    with:
      publish_images: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images == true }}
  stage-5-staging-and-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_http_smoke == true
    needs: stage-4-build-and-packaging
    uses: ./.github/workflows/05-deploy-staging-smoke-test.yml
  stage-6-production-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: stage-4-build-and-packaging
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/06-deploy-production.yml
    with:
      deployment_strategy: ${{ inputs.deployment_strategy || 'blue-green' }}
