name: "05 - Explicit Isolated HTTP Smoke"
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-http-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build WAR without starting full application
        run: mvn -B package -DskipTests
      - name: Prepare isolated Tomcat runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.25/bin/apache-tomcat-11.0.25.zip' -OutFile 'target/tomcat-smoke.zip'
          Expand-Archive -LiteralPath 'target/tomcat-smoke.zip' -DestinationPath 'target/tomcat-smoke-runtime'
      - name: Run default web context and WAR context boundary smoke
        id: smoke
        shell: pwsh
        run: ./src/test/scripts/swagger-smoke.ps1 -TomcatHome 'target/tomcat-smoke-runtime/apache-tomcat-11.0.25'
      - name: Report observed smoke status
        if: always()
        shell: pwsh
        run: |
          'Isolated Swagger HTTP boundary test step: ${{ steps.smoke.outcome }}. Full app, DB workflows and SMTP were not started.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-http-smoke-logs
          path: target/swagger-smoke/
          retention-days: 7
