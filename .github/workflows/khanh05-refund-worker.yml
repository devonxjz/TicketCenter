name: KHANH-05 refund worker acceptance
on:
  push:
    branches: [dev, feat/khanh/khanh-05-refund-worker]
  pull_request:
    branches: [dev]
    paths: ['src/main/java/vn/ticketscenter/fulfillment/**', 'src/main/java/vn/ticketscenter/payment/integration/*RefundGateway.java', 'src/main/java/vn/ticketscenter/config/worker/RefundJob.java', 'src/test/java/vn/ticketscenter/database/**', 'src/test/java/vn/ticketscenter/fulfillment/refund/worker/**', 'database/migrations/**', 'src/test/resources/refund/khanh05/**', '.github/workflows/khanh05-refund-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refund-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ format('Khanh05_{0}_Aa!', github.run_id) }}
        ports: ['1433:1433']
      redis:
        image: redis:7.4
        ports: ['6379:6379']
    env:
      TC_REFUND_WORKER_SQL_TEST: 'true'
      TC_REFUND_WORKER_REDIS_TEST: 'true'
      TC_SCAN_TEST_URL: 'jdbc:sqlserver://127.0.0.1:1433;databaseName=TicketCenter_Khanh02_Test;encrypt=true;trustServerCertificate=true;loginTimeout=5'
      TC_SCAN_SA_PASSWORD: ${{ format('Khanh05_{0}_Aa!', github.run_id) }}
      TC_SCAN_OWNER_USER: khanh02_owner
      TC_SCAN_CHECKIN_USER: khanh02_checkin
      REDIS_HOST: '127.0.0.1'
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate masked disposable fixture credentials
        shell: python
        run: |
          import os,secrets
          values={key:'K02!'+secrets.token_hex(24) for key in ('TC_SCAN_OWNER_PASSWORD','TC_SCAN_CHECKIN_PASSWORD','TC_SCAN_FIXTURE_PASSWORD','TC_TICKET_SIGNING_SECRET')}
          for value in [os.environ['TC_SCAN_SA_PASSWORD'],*values.values()]: print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key,value in values.items(): out.write(key+'='+value+'\n')
      - name: Build Java 25 test harness
        run: mvn -B -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/khanh05-classpath.txt -Dmdep.includeScope=test
      - name: Wait for isolated SQL Server
        run: |
          set -euo pipefail
          container=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_SCAN_SA_PASSWORD" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
      - name: Install complete canonical schema and KHANH-05 contract
        run: java -cp "target/test-classes:target/classes:$(cat target/khanh05-classpath.txt)" vn.ticketscenter.database.RefundWorkerCiSetup
      - name: Test durable attempts, real SQL/JPA, Redis, crashes and separate JVM restart
        run: mvn -B test -Djunit.jupiter.extensions.autodetection.enabled=false -Dtest=RefundWorkerTest,WorkerCrashRecoveryTest,RefundWorkerSqlServerTest,RefundWorkerRedisTest,AppConfigPrivateConfigurationTest
      - name: Require all acceptance suites and no skipped tests
        if: always()
        run: node src/test/scripts/test-report-summary.cjs target/surefire-reports --require-no-skips --require-suite=vn.ticketscenter.fulfillment.refund.worker.RefundWorkerTest --require-suite=vn.ticketscenter.fulfillment.refund.worker.WorkerCrashRecoveryTest --require-suite=vn.ticketscenter.database.RefundWorkerSqlServerTest --require-suite=vn.ticketscenter.fulfillment.refund.worker.RefundWorkerRedisTest --require-suite=vn.ticketscenter.config.AppConfigPrivateConfigurationTest --summary="$GITHUB_STEP_SUMMARY"
      - name: Package complete WAR
        run: mvn -B -DskipTests package
      - name: Verify private configuration is absent from WAR
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('target/ticketscenter.war') as war:
              assert 'WEB-INF/classes/application.properties' not in war.namelist()
              assert not any('/.local/' in name for name in war.namelist())
          print('WAR contains no private application configuration.')
          PY
      - name: Accept scheduled worker, timeout and real restart on Tomcat 11
        run: python3 src/test/resources/refund/khanh05/web-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khanh05-refund-worker-acceptance
          path: |
            target/surefire-reports/
            target/khanh05-web-acceptance.json
            target/khanh05-tomcat-*.log
