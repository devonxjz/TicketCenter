name: "02 - Safe Unit Tests and Opt-in Database Tests"
on:
  workflow_call:
    inputs:
      run_db_tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_db_tests:
        description: "Run actual database tests in a disposable SQL Server fixture"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe default Java tests
        run: mvn -B clean test
      - name: Swagger and report-summary tests
        run: node --test src/test/js/swagger-initializer.test.cjs src/test/scripts/test-report-summary.test.cjs
      - name: Actual Java test totals
        if: always()
        run: node src/test/scripts/test-report-summary.cjs target/surefire-reports --summary="$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-safe-unit-reports
          path: target/surefire-reports/
          retention-days: 7
  database-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_db_tests == true
    runs-on: ubuntu-latest
    env:
      TC_TEST_SQL_PASSWORD: ${{ format('TCci_{0}_Aa!', github.run_id) }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ format('TCci_{0}_Aa!', github.run_id) }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize dedicated UUID fixture and finance migration
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$TC_TEST_SQL_PASSWORD"
          test -f database/tests/vuong/001_uuid_test_schema.sql
          test -f database/migrations/027_vuong_finance.sql
          container=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          test -n "$container"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_TEST_SQL_PASSWORD" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          database="TC_Vuong_Test_CI_${GITHUB_RUN_ID}"
          docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_TEST_SQL_PASSWORD" -C -b -Q "CREATE DATABASE [$database];"
          docker cp database/tests/vuong/001_uuid_test_schema.sql "$container":/tmp/vuong_fixture.sql
          docker cp database/migrations/027_vuong_finance.sql "$container":/tmp/vuong_finance.sql
          docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_TEST_SQL_PASSWORD" -C -b -d "$database" -i /tmp/vuong_fixture.sql
          docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_TEST_SQL_PASSWORD" -C -b -d "$database" -i /tmp/vuong_finance.sql
      - name: Run finance JDBC cases with explicit opt-in and no SMTP
        shell: bash
        run: |
          set -euo pipefail
          test -f src/test/java/vn/ticketscenter/settlement/repository/FinanceRepositoryIntegrationTest.java
          test -f src/test/java/vn/ticketscenter/report/integration/ReadsideDatabaseIntegrationTest.java
          database="TC_Vuong_Test_CI_${GITHUB_RUN_ID}"
          export DB_NAME="$database"
          export DB_URL="jdbc:sqlserver://127.0.0.1:1433;databaseName=$database;loginTimeout=5;encrypt=false;trustServerCertificate=true"
          export DB_USER=sa
          export DB_PASSWORD="$TC_TEST_SQL_PASSWORD"
          export DB_ADMIN_USER="$DB_USER" DB_ADMIN_PASSWORD="$DB_PASSWORD"
          mvn -B clean test -Dtc.tests.db=true -Dtc.tests.smtp=false \
            -Dtc.tests.db.name="$database" \
            -Dtest='FinanceRepositoryIntegrationTest,ReadsideDatabaseIntegrationTest'
      - name: Require actual executed DB cases without skips
        if: always()
        run: node src/test/scripts/test-report-summary.cjs target/surefire-reports --require-no-skips --require-suite=vn.ticketscenter.settlement.repository.FinanceRepositoryIntegrationTest --require-suite=vn.ticketscenter.report.integration.ReadsideDatabaseIntegrationTest --summary="$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-opt-in-db-reports
          path: target/surefire-reports/
          retention-days: 7
