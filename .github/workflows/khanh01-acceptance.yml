# Explicitly authorized KHANH-01 acceptance; temporary local services, no deployment/shared credentials.
name: KHANH-01 SQL Redis and SMTP acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Khanh01_{0}_Aa!', github.run_id) }}
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ format('Khanh01_{0}_Aa!', github.run_id) }}' -C -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '1433'
      DB_NAME: TicketCenter_Khanh01_Test
      DB_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=TicketCenter_Khanh01_Test;encrypt=true;trustServerCertificate=true;loginTimeout=15
      DB_USER: sa
      DB_PASSWORD: ${{ format('Khanh01_{0}_Aa!', github.run_id) }}
      DB_CHECK_IN_USER: khanh01_checkin
      DB_TRUSTSERVERCERTIFICATE: 'true'
      TC_SQL_TEST_DB: TicketCenter_Khanh01_Test
      TC_SQL_TEST_LOGIN: khanh01_checkin
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_PASSWORD: ''
      MAIL_SMTP_HOST: 127.0.0.1
      MAIL_SMTP_PORT: '18825'
      MAIL_SMTP_USER: capture@fixture.invalid
      MAIL_SMTP_PASSWORD: local-fixture-only
      ADMIN_SEED_ENABLED: 'true'
      ADMIN_EMAIL: khanh01-admin@fixture.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Generate disposable fixture credentials
        shell: bash
        run: |
          set -euo pipefail
          password="K01!$(openssl rand -hex 20)"
          admin_password="K01!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$DB_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
          printf 'DB_CHECK_IN_PASSWORD=%s\nTC_SQL_TEST_PASSWORD=%s\nTC_CHECKIN_FIXTURE_PASSWORD=%s\n' "$password" "$password" "$password" >> "$GITHUB_ENV"
      - name: Create isolated SQL schema and fixture
        env:
          SQL_CONTAINER: ${{ job.services.mssql.id }}
        shell: bash
        run: |
          set -euo pipefail
          mvn -B test-compile dependency:build-classpath -Dmdep.outputFile=target/khanh01-classpath.txt
          cp="target/test-classes:target/classes:$(cat target/khanh01-classpath.txt)"
          java -cp "$cp" vn.ticketscenter.fulfillment.checkin.integration.LocalCheckInFixture ddl
          java -cp "$cp" vn.ticketscenter.fulfillment.checkin.integration.LocalCheckInCiSetup
          docker cp target/khanh01-model-schema.sql "$SQL_CONTAINER:/tmp/model.sql"
          docker cp src/test/resources/checkin/local-contract.sql "$SQL_CONTAINER:/tmp/contract.sql"
          for script in model contract; do
            docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -C -b -d TicketCenter_Khanh01_Test -i "/tmp/$script.sql"
          done
          java -cp "$cp" vn.ticketscenter.fulfillment.checkin.integration.LocalCheckInFixture
          java -cp "$cp" vn.ticketscenter.fulfillment.checkin.integration.LocalCheckInFixture tickets
          sed -n '/^TC_CHECKIN_[A-Z_]*=/p' docs/handoff/khanh01-fixture.properties >> "$GITHUB_ENV"
      - name: Start loopback STARTTLS capture
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -alias local-capture -keyalg RSA -keysize 2048 -validity 2 -dname CN=localhost -ext SAN=ip:127.0.0.1,dns:localhost -storetype PKCS12 -keystore target/khanh01-smtp.p12 -storepass local-fixture-only -keypass local-fixture-only -noprompt
          java -cp target/test-classes vn.ticketscenter.fulfillment.checkin.integration.LocalAcceptanceSmtpServer target/khanh01-smtp.p12 target/khanh01-smtp-count.txt >target/khanh01-smtp.log 2>&1 &
          for attempt in {1..20}; do
            if grep -q READY target/khanh01-smtp.log; then exit 0; fi
            sleep 1
          done
          cat target/khanh01-smtp.log
          exit 1
      - name: Full Maven regression and WAR
        shell: bash
        run: |
          set -euo pipefail
          mvn -B '-DargLine=-Djavax.net.ssl.trustStore=target/khanh01-smtp.p12 -Djavax.net.ssl.trustStorePassword=local-fixture-only' test | tee target/khanh01-full-regression.log
          test "$(cat target/khanh01-smtp-count.txt)" -ge 2
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in glob.glob('target/surefire-reports/TEST-*.xml')]
          assert suites, 'Surefire reports missing'
          for suite in suites:
              assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), suite.get('name')
          print('All regression tests executed, with no failures/errors/skips:', sum(int(s.get('tests', '0')) for s in suites))
          PY
          cp -R target/surefire-reports target/khanh01-full-surefire-reports
          mvn -B -DskipTests package
      - name: Real SQL Server and Redis acceptance
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -Psqlserver-it '-Dtest=CheckInEventServiceTest,RedisCheckInEventCacheTest,CheckInServletsTest,CheckInEventRepositoryTest' '-Dit.test=CheckInEventSqlServerIT,CheckInEventAcceptanceIT' verify | tee target/khanh01-local-integration.log
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in glob.glob('target/failsafe-reports/TEST-*.xml')]
          assert sum(int(s.get('tests', '0')) for s in suites) == 11, 'Expected all 11 real SQL/Redis acceptance tests'
          for suite in suites:
              assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), suite.get('name')
          PY
      - name: Upload actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khanh01-acceptance-evidence
          path: |
            target/surefire-reports/
            target/khanh01-full-surefire-reports/
            target/failsafe-reports/
            target/khanh01-full-regression.log
            target/khanh01-local-integration.log
            target/khanh01-smtp-count.txt
          retention-days: 7
