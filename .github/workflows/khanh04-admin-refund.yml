name: KHANH-04 admin refund acceptance
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths: ['src/main/java/vn/ticketscenter/fulfillment/refund/**', 'src/main/java/vn/ticketscenter/admin/controller/AdminServlet.java', 'src/main/resources/openapi.json', 'src/main/webapp/WEB-INF/views/admin/refunds/**', 'src/main/webapp/assets/refund/**', 'src/test/**/refund/**', 'src/test/java/vn/ticketscenter/database/AdminRefund*.java', 'database/migrations/043_khanh04_admin_refund.sql', 'database/migrations/046_admin_refund_current_authority.sql', '.github/workflows/khanh04-admin-refund.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ format('Khanh04_{0}_Aa!', github.run_id) }}
        ports: ['1433:1433']
      redis:
        image: redis:7.4
        ports: ['16379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TC_ADMIN_REFUND_TEST: 'true'
      TC_SCAN_INTEGRATION: 'true'
      TC_SCAN_TEST_URL: 'jdbc:sqlserver://127.0.0.1:1433;databaseName=TicketCenter_Khanh02_Test;encrypt=true;trustServerCertificate=true;loginTimeout=5'
      TC_SCAN_SA_PASSWORD: ${{ format('Khanh04_{0}_Aa!', github.run_id) }}
      TC_SCAN_OWNER_USER: khanh02_owner
      TC_SCAN_CHECKIN_USER: khanh02_checkin
      TC_ADMIN_REFUND_DB_USER: khanh04_admin
      TC_ADMIN_REFUND_BUYER_DB_USER: khanh04_buyer
      TC_ADMIN_REFUND_BROWSER_SCRIPT: src/test/resources/refund/khanh04/browser-acceptance.cjs
      NODE_PATH: ./target/khanh04-browser/node_modules
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate masked disposable credentials
        shell: python
        run: |
          import os, secrets
          values = {key: 'K02!' + secrets.token_hex(24) for key in ('TC_SCAN_OWNER_PASSWORD','TC_SCAN_CHECKIN_PASSWORD','TC_SCAN_FIXTURE_PASSWORD','TC_TICKET_SIGNING_SECRET')}
          values['TC_ADMIN_REFUND_DB_PASSWORD'] = 'K04!' + secrets.token_hex(24)
          values['TC_ADMIN_REFUND_BUYER_DB_PASSWORD'] = 'K04!' + secrets.token_hex(24)
          for value in [os.environ['TC_SCAN_SA_PASSWORD'], *values.values()]: print('::add-mask::' + value)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for key, value in values.items(): out.write(key + '=' + value + '\n')
      - name: Build real SQL and web harness
        run: mvn -B -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/khanh04-classpath.txt -Dmdep.includeScope=test
      - name: Wait for isolated SQL Server
        run: |
          set -euo pipefail
          container=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TC_SCAN_SA_PASSWORD" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
      - name: Install canonical schema and restricted admin contract
        run: java -cp "target/test-classes:target/classes:$(cat target/khanh04-classpath.txt)" vn.ticketscenter.database.AdminRefundCiSetup
      - name: Test DEC-01 through DEC-05, rollback, races, current roles, zero-value tickets and Redis
        run: mvn -B test -Djunit.jupiter.extensions.autodetection.enabled=false -Dtest=AdminRefundDecisionSqlServerTest,AdminRefundJsonTest,AdminRefundDecisionServiceTest,RedisAdminRefundCacheTest,AdminRefundOpenApiContractTest
      - name: Require actual SQL and Redis execution without skips
        if: always()
        run: node src/test/scripts/test-report-summary.cjs target/surefire-reports --require-no-skips --require-suite=vn.ticketscenter.database.AdminRefundDecisionSqlServerTest --require-suite=vn.ticketscenter.fulfillment.refund.service.RedisAdminRefundCacheTest --summary="$GITHUB_STEP_SUMMARY"
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix target/khanh04-browser --no-audit --no-fund playwright@1.62.1
          ./target/khanh04-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Package the complete production WAR
        run: mvn -B -DskipTests package
      - name: Real login, servlet, JSP, lost-response replay and desktop/mobile browser acceptance
        run: python3 src/test/resources/refund/khanh04/web-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khanh04-admin-refund-acceptance
          path: |
            target/surefire-reports/
            target/khanh04-tomcat.log
            target/khanh04-web-acceptance.json
            target/khanh04-browser-acceptance.json
            target/khanh04-*.png
